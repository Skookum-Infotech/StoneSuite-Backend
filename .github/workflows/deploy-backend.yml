name: Deploy Backend to Fly.io

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  deploy:
    name: Test → Deploy → Verify
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pinned to match ci-backend.yml's Setup Go steps (bumped together,
          # not automatically) -- not 'stable', which let the runner's
          # resolved Go patch drift ahead of what golangci-lint v2.12.2 was
          # verified against there and broke CI with an unrelated go/types
          # panic (see ci-backend.yml's header comment, PR #134).
          go-version: '1.25.13'
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 120

      - name: Health check
        run: |
          echo "Waiting for instance to be ready..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stonesuite-backend.fly.dev/api)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — HTTP $STATUS. Rolling back..."
            exit 1
          fi
          echo "Health check passed — HTTP $STATUS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Rollback on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deployment or health check failed. Rolling back to previous release..."
          flyctl releases rollback --app stonesuite-backend --yes
