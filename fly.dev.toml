app            = "dev-stonesuite-api"
primary_region = "iad"

[env]
  # APP_ENV must be "production" here even though this is the dev instance —
  # it gates the Secure flag on auth cookies (config.AppConfig.IsProduction()),
  # and this app is only ever served over HTTPS on Fly. Without it, cookies
  # are set without Secure, which browsers silently reject.
  APP_ENV             = "production"
  PORT                = "8080"
  # IMPORTANT: CORS_ORIGIN and FRONTEND_URL must match the exact origin of the deployed
  # frontend (including protocol and port). Verify this matches the Cloudflare Pages URL
  # before deploying. A mismatch will block all browser API calls with CORS 403 errors.
  CORS_ORIGIN         = "https://dev.stonesuite.app,https://dev-stonesuite-webui.pages.dev"
  FRONTEND_URL        = "https://dev.stonesuite.app"
  # The deployed dev WebUI (dev.stonesuite.app and dev-stonesuite-webui.pages.dev)
  # calls this backend directly cross-origin — VITE_API_BASE_URL is the absolute
  # https://dev-stonesuite-api.fly.dev/api, not a same-origin "/api" proxy.
  # A cross-site response cannot set a SameSite=Lax cookie the browser will send
  # back on later XHR, so the auth_token / refresh_token cookies must be
  # SameSite=None or every dev session is logged out on the next hard refresh.
  #
  # "none" also activates the CSRF check in middleware/csrf.go. That check now
  # accepts a request whose Origin is in CORS_ORIGIN (below) as well as the
  # X-CSRF-Token double-submit token, so it no longer 403s when the csrf_token
  # cookie is absent/expired — the flapping that got this line reverted before
  # (PRs #167 -> #170 -> #171 -> #178). Requires APP_ENV = "production" above so
  # cookies are Secure; browsers drop SameSite=None cookies that are not Secure.
  # ci-backend.yml guards that both stay set together.
  #
  # Prod (fly.toml / fly.prod.toml) intentionally stays on the "lax" default —
  # changing the production backend is a separate, higher-stakes decision. See
  # docs/superpowers/specs/2026-08-12-dev-direct-cors-auth-design.md.
  COOKIE_SAME_SITE_MODE = "none"
  SMTP_PORT           = "587"
  INVITE_EXPIRY_HOURS = "24"
  # Gates who may hold platform-admin / tenant super_admin in the platform-owner tenant.
  PLATFORM_ADMIN_EMAIL_DOMAIN = "skookuminfotech.com"

  # Cloudflare R2 — non-secret config (account ID and bucket name are not sensitive).
  # Secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) must be set via:
  #   fly secrets set R2_ACCESS_KEY_ID=<key> R2_SECRET_ACCESS_KEY=<secret>
  #
  # R2 (per-tenant isolated buckets — no shared bucket):
  # Secrets (set via fly secrets set):
  #   R2_ACCOUNT_ID          — Cloudflare account ID (found in R2 dashboard)
  #   R2_ACCESS_KEY_ID       — R2 API token key ID (S3-compat credentials)
  #   R2_SECRET_ACCESS_KEY   — R2 API token secret
  #   CLOUDFLARE_API_TOKEN   — Cloudflare API token with Account:R2:Edit permission
  #   CLOUDFLARE_ACCOUNT_ID  — same as R2_ACCOUNT_ID
  # Each tenant gets an isolated bucket named ss-{slug} with CORS set from CORS_ORIGIN.

[http_service]
  internal_port        = 8080
  force_https          = true
  # Scale-to-zero: the only running Machine is stopped by Fly Proxy after a
  # period of no requests, and auto-started on the next request (~1-2s cold
  # start — a clean process restart, so DB pools come up fresh). At idle the app
  # costs nothing.
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  [http_service.concurrency]
    type        = "requests"
    soft_limit  = 200
    hard_limit  = 250

  # NO periodic health check on purpose. A recurring [[http_service.checks]]
  # ping counts as traffic and keeps the Machine awake forever, defeating
  # scale-to-zero. Fly never auto-stops/starts based on check status anyway.
  # Liveness/readiness are still exposed in-app (GET /api/healthz, /api/readyz)
  # for an external uptime monitor (e.g. UptimeRobot) — point that at /api/healthz.
  # If you ever pin a Machine always-on (min_machines_running = 1), re-add:
  #   [[http_service.checks]]
  #     interval = "30s"
  #     method   = "GET"
  #     path     = "/api/healthz"
  #     timeout  = "5s"

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
